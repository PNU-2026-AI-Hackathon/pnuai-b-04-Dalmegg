services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: dalmegg-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build:
      context: ./backend
    container_name: dalmegg-backend
    env_file:
      - ./backend/.env
    environment:
      MQTT_HOST: mosquitto
    ports:
      - "8000:8000"
    depends_on:
      - mosquitto
